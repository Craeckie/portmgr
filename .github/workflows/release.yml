name: release

# Releasing = bumping `version` in pyproject.toml together with its CHANGELOG.md
# section and pushing to master. `check` decides whether that version is new;
# the tag is created by the GitHub release at the end.
on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/release.yml
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # all tags, for the "newer than the latest release" check

      - name: Check version and extract changelog
        id: check
        run: .github/scripts/release-check.sh

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.should_release == 'true'
        with:
          name: notes
          path: notes.md

  test:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra secrets --group dev

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: [test, build]  # publish only if tests pass and the build succeeds
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/portmgr/
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # PyPI's trusted-publishing endpoint has outages of its own (502/503 while
      # the rest of pypi.org is up); wait for it rather than failing the release.
      - name: Wait for PyPI trusted publishing
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://upload.pypi.org/_/oidc/audience)
            [ "$code" = 200 ] && exit 0
            echo "PyPI OIDC audience endpoint returned $code (check $i/30), retrying in 60s"
            sleep 60
          done
          echo "::warning::PyPI OIDC endpoint still unavailable after 30 min, trying anyway"

      - name: Publish to PyPI
        id: publish1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Wait before retry
        if: steps.publish1.outcome == 'failure'
        run: sleep 120

      - name: Publish to PyPI (retry 1)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a failed attempt may have uploaded some files

      - name: Wait before retry
        if: steps.publish2.outcome == 'failure'
        run: sleep 120

      - name: Publish to PyPI (retry 2)
        if: steps.publish2.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Purge PyPI CDN cache
        run: |
          # PyPI's JSON API and project page are Fastly-cached; purge so the new
          # version shows up immediately instead of after the cache TTL.
          curl -fsS -X PURGE https://pypi.org/pypi/portmgr/json || true
          curl -fsS -X PURGE https://pypi.org/project/portmgr/ || true

  github-release:
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # Creates the tag on the released commit; the body is the CHANGELOG.md section.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
